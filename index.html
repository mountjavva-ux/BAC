const pad = (n) => String(n).padStart(2, "0");
const num = (v) => Number(v) || 0;
const nowIso = () => new Date().toISOString();
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const newId = (p) => {
  const a = new Uint8Array(6);
  (globalThis.crypto || window.crypto).getRandomValues(a);
  return p + "_" + Array.from(a).map((b) => b.toString(16).padStart(2, "0")).join("");
};
const fmtRp = (n) => "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID");
const fmtNum = (n) => Math.round(Number(n) || 0).toLocaleString("id-ID");
const fmtDate = (s) => {
  if (!s) return "-";
  const [y, m, d] = String(s).split("-");
  if (!d) return s;
  return `${d}/${m}/${y.slice(2)}`;
};
const cx = (...a) => a.filter(Boolean).join(" ");
const MONTHS = ["", "Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const labelMonth = (m) => { const [y, mo] = String(m).split("-"); return `${MONTHS[Number(mo)] || ""} ${y}`; };

// Angka gaya Indonesia: "188.000" -> 188000, "1.234,5" -> 1234.5
const parseNum = (v) => {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v ?? "0").trim();
  if (["", "-", "nan", "None", "undefined", "null"].includes(s)) return 0;
  s = s.replace(/[^0-9,.\-]/g, "").replace(/\./g, "").replace(/,/g, ".");
  const f = parseFloat(s);
  return isNaN(f) ? 0 : f;
};
const isCair = (st) => String(st || "").toLowerCase().includes("cair");
const isCancelled = (st) => { const s = String(st || "").toLowerCase(); return s.includes("batal") || s.includes("kembali"); };

const findCol = (cols, ...cands) => {
  const low = cols.map((c) => [String(c).toLowerCase().trim(), c]);
  for (const cand of cands) for (const [lc, orig] of low) if (lc.includes(cand)) return orig;
  return null;
};
const matchSku = (name, skus) => {
  const n = String(name || "").toLowerCase();
  for (const sku of skus) for (const kw of sku.keywords || []) if (kw && n.includes(String(kw).toLowerCase().trim())) return sku;
  return null;
};

const cashSorted = (cash) => {
  const e = [...cash].sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")) || String(a.created_at || "").localeCompare(String(b.created_at || "")));
  let bal = 0;
  return e.map((x) => { bal += num(x.pemasukan) - num(x.pengeluaran); return { ...x, saldo_akhir: bal }; });
};
const filterCash = (entries, start, end) => entries.filter((e) => {
  const d = e.date || "";
  if (start && d < start) return false;
  if (end && d > end) return false;
  return true;
});
const sum = (arr, f) => arr.reduce((t, x) => t + (num(f(x))), 0);

const computeDashboard = ({ skus, cash, orders, settings, start, end }) => {
  const all = cashSorted(cash);
  const saldo = all.length ? all[all.length - 1].saldo_akhir : 0;
  const entries = filterCash(all, start, end);
  const critical = skus.filter((s) => num(s.stock) <= (s.min_stock ?? 10));
  let ords = orders;
  if (start || end) ords = ords.filter((o) => (!start || (o.tanggal_kirim || "") >= start) && (!end || (o.tanggal_kirim || "") <= end));
  const flow = {};
  for (const e of entries) {
    const d = e.date;
    flow[d] = flow[d] || { date: d, pemasukan: 0, pengeluaran: 0 };
    flow[d].pemasukan += num(e.pemasukan);
    flow[d].pengeluaran += num(e.pengeluaran);
  }
  const nowMonth = todayStr().slice(0, 7);
  return {
    saldo,
    bulan_ini: nowMonth,
    omzet_bulan_ini: sum(all.filter((e) => (e.date || "").slice(0, 7) === nowMonth), (e) => e.pemasukan),
    monthly_target: num(settings?.monthly_target),
    total_pemasukan: sum(entries, (e) => e.pemasukan),
    total_pengeluaran: sum(entries, (e) => e.pengeluaran),
    total_skus: skus.length,
    stock_value: sum(skus, (s) => num(s.stock) * num(s.price)),
    critical_count: critical.length,
    critical_items: critical.slice(0, 5),
    shopee_revenue: sum(ords, (o) => o.pendapatan_akhir),
    shopee_belum_cair: sum(ords.filter((o) => !o.cair), (o) => o.pendapatan_akhir),
    cash_flow: Object.values(flow).sort((a, b) => a.date.localeCompare(b.date)).slice(-14)
  };
};

const computeMonthly = (cash) => {
  const rep = {};
  for (const e of cashSorted(cash)) {
    const m = (e.date || "").slice(0, 7);
    if (!m) continue;
    const r = (rep[m] = rep[m] || { month: m, pemasukan: 0, pengeluaran: 0, shopee: 0 });
    r.pemasukan += num(e.pemasukan);
    r.pengeluaran += num(e.pengeluaran);
    if (e.source === "Shopee Auto") r.shopee += num(e.pemasukan);
  }
  return Object.values(rep).sort((a, b) => b.month.localeCompare(a.month)).map((r) => ({ ...r, net: r.pemasukan - r.pengeluaran }));
};

const computeTopProducts = (orders, skus, month) => {
  const skuMap = Object.fromEntries(skus.map((s) => [s.id, s]));
  const agg = {};
  for (const o of orders) {
    if (!o.sku_id || isCancelled(o.status)) continue;
    const m = String(o.tanggal_kirim || (o.created_at || "").slice(0, 10)).slice(0, 7);
    if (month && m !== month) continue;
    const sku = skuMap[o.sku_id];
    if (!sku) continue;
    const a = (agg[o.sku_id] = agg[o.sku_id] || { sku_code: sku.code, name: sku.name, qty: 0, revenue: 0 });
    a.qty += num(o.qty);
    a.revenue += num(o.pendapatan_akhir);
  }
  return Object.values(agg).sort((a, b) => b.qty - a.qty).slice(0, 8);
};

const buildPreview = (rows, skus, biayaPct) => {
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const cOrder = findCol(cols, "no. pesanan", "no pesanan", "order");
  const cStatus = findCol(cols, "status pesanan", "status");
  const cProduct = findCol(cols, "nama produk", "product");
  const cVar = findCol(cols, "nama variasi", "variasi");
  const cQty = findCol(cols, "jumlah", "quantity");
  const cNilai = findCol(cols, "subtotal pesanan", "subtotal", "total pembayaran", "total");
  const cKirim = findCol(cols, "waktu pengiriman diatur", "waktu pesanan dibuat", "waktu pembayaran");
  if (!cProduct) throw new Error("Format file tidak dikenali. Pastikan ada kolom Nama Produk.");
  const toDateStr = (v) => {
    if (!v) return "";
    if (v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
    const s = String(v).trim();
    return s.toLowerCase() === "nan" ? "" : s.split(" ")[0];
  };
  const items = [];
  for (const row of rows) {
    const product = String(row[cProduct] ?? "").trim();
    if (!product || product.toLowerCase() === "nan") continue;
    let variation = cVar ? String(row[cVar] ?? "").trim() : "";
    if (variation.toLowerCase() === "nan") variation = "";
    const fullName = `${product} ${variation}`.trim();
    const qty = cQty ? Math.trunc(parseNum(row[cQty])) || 1 : 1;
    const nilai = cNilai ? parseNum(row[cNilai]) : 0;
    const biaya = Math.round(nilai * (num(biayaPct) / 100));
    const m = matchSku(fullName, skus);
    items.push({
      order_no: cOrder ? String(row[cOrder] ?? "").trim() : "",
      product_name: product, variation, qty, nilai, biaya,
      pendapatan_akhir: nilai - biaya,
      status: cStatus ? String(row[cStatus] ?? "").trim() : "",
      tanggal_kirim: cKirim ? toDateStr(row[cKirim]) : "",
      sku_id: m ? m.id : null, sku_code: m ? m.code : null, sku_name: m ? m.name : null
    });
  }
  return { items, total: items.length, matched: items.filter((i) => i.sku_id).length };
};

/* ======================= AKSI DATABASE ======================= */
const COLLECTIONS = ["skus", "cash", "shopee_orders", "stock_history"];
const ref = (name, id) => doc(db, name, id);

async function logStock(sku, delta, reason, actor) {
  const id = newId("sh");
  await setDoc(ref("stock_history", id), {
    id, sku_id: sku.id, sku_code: sku.code, sku_name: sku.name,
    delta, reason, balance_after: num(sku.stock), actor, created_at: nowIso()
  });
}
async function fetchHistory(skuId) {
  const snap = await getDocs(query(collection(db, "stock_history"), where("sku_id", "==", skuId)));
  return snap.docs.map((d) => d.data()).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
}
const skuFields = (p) => ({
  code: String(p.code || "").trim(), name: String(p.name || "").trim(), category: p.category || "",
  stock: Math.trunc(num(p.stock)), unit: p.unit || "Pcs", min_stock: Math.trunc(num(p.min_stock)),
  price: num(p.price), keywords: p.keywords || []
});
async function createSku(p, actor, skus) {
  const f = skuFields(p);
  if (!f.code || !f.name) throw new Error("Kode dan nama produk wajib diisi");
  if (skus.some((s) => s.code === f.code)) throw new Error("Kode SKU sudah ada");
  const id = newId("sku");
  const d = { id, ...f, created_at: nowIso() };
  await setDoc(ref("skus", id), d);
  if (d.stock) await logStock(d, d.stock, "Stok awal SKU baru", actor);
}
async function updateSku(id, p, old, actor, skus) {
  const f = skuFields(p);
  if (!f.code || !f.name) throw new Error("Kode dan nama produk wajib diisi");
  if (skus.some((s) => s.id !== id && s.code === f.code)) throw new Error("Kode SKU sudah ada");
  await updateDoc(ref("skus", id), f);
  if (old && num(old.stock) !== f.stock) await logStock({ ...old, ...f, id }, f.stock - num(old.stock), "Koreksi stok lewat edit SKU", actor);
}
async function adjustStock(skuId, delta, reason, actor) {
  const snap = await getDoc(ref("skus", skuId));
  if (!snap.exists()) return;
  const sku = snap.data();
  const stock = Math.max(0, num(sku.stock) + delta);
  await updateDoc(ref("skus", skuId), { stock });
  await logStock({ ...sku, stock }, delta, reason, actor);
}
async function deleteSku(id) { await deleteDoc(ref("skus", id)); }

// Kas Shopee hanya dicatat saat pesanan sudah cair (masuk rekening)
async function syncOrderCash(order) {
  const cashId = "shopee_" + order.id;
  const r = ref("cash", cashId);
  const should = !!order.cair && num(order.pendapatan_akhir) > 0;
  if (should) {
    const data = {
      id: cashId, date: order.tanggal_cair || todayStr(), pemasukan: num(order.pendapatan_akhir),
      ket_pemasukan: `Shopee - ${order.order_no}`, pengeluaran: 0, ket_pengeluaran: "",
      source: "Shopee Auto", ref: order.id
    };
    const snap = await getDoc(r);
    if (snap.exists()) await updateDoc(r, data);
    else await setDoc(r, { ...data, created_at: nowIso() });
    return true;
  }
  await deleteDoc(r);
  return false;
}
// Sinkronkan stok dan kas sesuai status pesanan. Aman dijalankan berulang (pakai deducted_qty)
async function applyOrderEffects(order, actor) {
  const skuId = order.sku_id;
  const desired = skuId && !isCancelled(order.status) ? num(order.qty) : 0;
  const diff = desired - num(order.deducted_qty);
  let stockChanged = false;
  if (diff !== 0 && skuId) {
    const snap = await getDoc(ref("skus", skuId));
    if (snap.exists()) {
      const sku = snap.data();
      const stock = Math.max(0, num(sku.stock) - diff);
      await updateDoc(ref("skus", skuId), { stock });
      await logStock({ ...sku, stock }, -diff, `Pesanan Shopee ${order.order_no} (${order.status})`, actor);
      stockChanged = true;
    }
    await updateDoc(ref("shopee_orders", order.id), { deducted_qty: desired });
    order.deducted_qty = desired;
  }
  const cashAdded = await syncOrderCash(order);
  return [stockChanged, cashAdded];
}

const same = (a, b) => (a ?? null) === (b ?? null);
async function processShopee(items, skus, orders, actor) {
  const skuNames = Object.fromEntries(skus.map((s) => [s.id, s.name]));
  const byKey = new Map(orders.filter((o) => o.order_no).map((o) => [orderKey(o), o]));
  let created = 0, updated = 0, ignored = 0, stockC = 0, cashC = 0;
  for (const item of items) {
    const raw = item.product_name;
    const display = item.sku_id && skuNames[item.sku_id] ? skuNames[item.sku_id] : raw;
    const key = `${item.order_no}|${raw}|${item.variation || ""}`;
    const existing = item.order_no ? byKey.get(key) : null;
    if (existing) {
      const incoming = {
        status: item.status || existing.status, nilai: item.nilai, biaya: item.biaya, qty: item.qty,
        sku_id: item.sku_id, shopee_title: raw, variation: item.variation, tanggal_kirim: item.tanggal_kirim
      };
      const cmp = { ...existing, shopee_title: existing.shopee_title ?? existing.product_name };
      if (Object.keys(incoming).every((f) => same(cmp[f], incoming[f]))) { ignored++; continue; }
      const newStatus = item.status || existing.status;
      const cair = isCair(newStatus) ? true : isCancelled(newStatus) ? false : !!existing.cair;
      const upd = {
        ...incoming, status: newStatus, product_name: display,
        pendapatan_akhir: item.nilai - item.biaya, cair,
        tanggal_cair: cair ? (existing.tanggal_cair || todayStr()) : ""
      };
      await updateDoc(ref("shopee_orders", existing.id), upd);
      const fresh = { ...existing, ...upd };
      const [sc, cc] = await applyOrderEffects(fresh, actor);
      byKey.set(key, fresh);
      updated++; if (sc) stockC++; if (cc) cashC++;
    } else {
      const cair = isCair(item.status);
      const id = newId("so");
      const doc_ = {
        id, order_no: item.order_no, product_name: display, shopee_title: raw, variation: item.variation || "",
        qty: item.qty, nilai: item.nilai, biaya: item.biaya,
        pendapatan_akhir: item.pendapatan_akhir || (item.nilai - item.biaya),
        status: item.status || "Selesai", tanggal_kirim: item.tanggal_kirim || "",
        tanggal_cair: cair ? todayStr() : "", cair, sku_id: item.sku_id || null,
        deducted_qty: 0, created_at: nowIso()
      };
      await setDoc(ref("shopee_orders", id), doc_);
      const [sc, cc] = await applyOrderEffects(doc_, actor);
      byKey.set(key, doc_);
      created++; if (sc) stockC++; if (cc) cashC++;
    }
  }
  return { orders_new: created, orders_updated: updated, orders_ignored: ignored, stock_updated: stockC, cash_added: cashC };
}

async function updateShopeeOrder(o, payload, actor) {
  const u = {};
  for (const k of ["status", "biaya", "nilai", "tanggal_cair", "cair"]) if (payload[k] !== undefined && payload[k] !== null) u[k] = payload[k];
  if ("cair" in u) {
    u.tanggal_cair = u.cair ? (u.tanggal_cair || o.tanggal_cair || todayStr()) : "";
  } else if ("status" in u) {
    if (isCair(u.status)) { u.cair = true; u.tanggal_cair = o.tanggal_cair || todayStr(); }
    else if (isCancelled(u.status)) { u.cair = false; u.tanggal_cair = ""; }
  }
  const nilai = "nilai" in u ? u.nilai : num(o.nilai);
  const biaya = "biaya" in u ? u.biaya : num(o.biaya);
  u.pendapatan_akhir = nilai - biaya;
  await updateDoc(ref("shopee_orders", o.id), u);
  await applyOrderEffects({ ...o, ...u }, actor);
}
async function deleteShopeeOrder(id) {
  await deleteDoc(ref("cash", "shopee_" + id));
  await deleteDoc(ref("shopee_orders", id));
}

async function readReportFile(file) {
  const name = (file.name || "").toLowerCase();
  let wb;
  if (name.endsWith(".csv")) wb = window.XLSX.read(await file.text(), { type: "string", raw: true });
  else wb = window.XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return window.XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function downloadCsv(headers, rows, name) {
  const esc = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const text = "\ufeff" + [headers, ...rows].map((r) => r.map(esc).join(",")).join("\r\n");
  downloadBlob(new Blob([text], { type: "text/csv;charset=utf-8" }), name);
}
function downloadXlsx(headers, rows, sheet, name) {
  const ws = window.XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, sheet);
  window.XLSX.writeFile(wb, name);
}
async function exportBackup() {
  const out = { app: "bac-business-hub", version: 1, exported_at: nowIso(), data: {} };
  for (const c of [...COLLECTIONS, "settings"]) {
    const snap = await getDocs(collection(db, c));
    out.data[c] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  }
  downloadBlob(new Blob([JSON.stringify(out)], { type: "application/json" }), `Backup_BAC_${todayStr()}.json`);
  return Object.values(out.data).reduce((t, a) => t + a.length, 0);
}
async function restoreBackup(obj) {
  if (!obj || obj.app !== "bac-business-hub" || !obj.data) throw new Error("File bukan backup BAC Business Hub");
  let total = 0;
  for (const c of [...COLLECTIONS, "settings"]) {
    const list = obj.data[c] || [];
    for (let i = 0; i < list.length; i += 400) {
      const batch = writeBatch(db);
      for (const rec of list.slice(i, i + 400)) {
        if (!rec.id) continue;
        batch.set(ref(c, rec.id), rec);
        total++;
      }
      await batch.commit();
    }
  }
  return total;
}

const emptyCash = () => ({ date: todayStr(), jenis: "pemasukan", amount: "", keterangan: "" });
const SRC_LABEL = { "Shopee Auto": "🤖 Shopee Auto", "AI Voice": "🎙 AI Voice", Manual: "✋ Manual" };

const CashBook = ({ d }) => {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState(emptyCash());
  const [q, setQ] = useState("");
  const [typeFilter, setTypeFilter] = useState("all");
  const [start, setStart] = useState("");
  const [end, setEnd] = useState("");
  const [limit, setLimit] = useState(100);
  const [saving, setSaving] = useState(false);

  const all = useMemo(() => cashSorted(d.cash), [d.cash]);
  const saldo = all.length ? all[all.length - 1].saldo_akhir : 0;
  const entries = useMemo(() => filterCash(all, start, end), [all, start, end]);
  const totalIn = sum(entries, (e) => e.pemasukan);
  const totalOut = sum(entries, (e) => e.pengeluaran);
  const filtered = useMemo(() => [...entries].reverse().filter((e) => {
    if (typeFilter === "pemasukan" && !(num(e.pemasukan) > 0)) return false;
    if (typeFilter === "pengeluaran" && !(num(e.pengeluaran) > 0)) return false;
    return !q || `${e.ket_pemasukan} ${e.ket_pengeluaran} ${e.source}`.toLowerCase().includes(q.toLowerCase());
  }), [entries, typeFilter, q]);

  const setPeriod = (kind) => {
    const now = new Date();
    const y = now.getFullYear();
    const last = (yy, mo) => new Date(yy, mo, 0).getDate();
    if (kind === "") { setStart(""); setEnd(""); return; }
    if (kind === "this-month") { const m = now.getMonth() + 1; setStart(`${y}-${pad(m)}-01`); setEnd(`${y}-${pad(m)}-${last(y, m)}`); return; }
    if (kind === "last-month") { const dt = new Date(y, now.getMonth() - 1, 1); const yy = dt.getFullYear(), m = dt.getMonth() + 1; setStart(`${yy}-${pad(m)}-01`); setEnd(`${yy}-${pad(m)}-${last(yy, m)}`); return; }
    if (kind[0] === "q") { const n = Number(kind[1]); const sm = (n - 1) * 3 + 1, em = n * 3; setStart(`${y}-${pad(sm)}-01`); setEnd(`${y}-${pad(em)}-${last(y, em)}`); return; }
    if (kind === "year") { setStart(`${y}-01-01`); setEnd(`${y}-12-31`); }
  };

  const save = async () => {
    const amount = Number(form.amount);
    if (!(amount > 0)) { toast("Isi nominal lebih dari 0", "err"); return; }
    if (!form.date) { toast("Isi tanggal", "err"); return; }
    setSaving(true);
    try {
      const income = form.jenis === "pemasukan";
      await createCash({
        date: form.date,
        pemasukan: income ? amount : 0, ket_pemasukan: income ? form.keterangan : "",
        pengeluaran: income ? 0 : amount, ket_pengeluaran: income ? "" : form.keterangan,
        source: "Manual"
      });
      toast("Transaksi tersimpan");
      setOpen(false); setForm(emptyCash());
    } catch (e) { toast("Gagal menyimpan", "err"); }
    finally { setSaving(false); }
  };
  const remove = async (e) => {
    if (!confirm("Hapus transaksi ini?")) return;
    try { await deleteCash(e.id); } catch (err) { toast("Gagal menghapus", "err"); }
  };
  const exportAs = (fmt) => {
    const headers = ["Tanggal", "Pemasukan", "Keterangan Pemasukan", "Pengeluaran", "Keterangan Pengeluaran", "Saldo Akhir", "Sumber"];
    const rows = entries.map((e) => [e.date || "", num(e.pemasukan), e.ket_pemasukan || "", num(e.pengeluaran), e.ket_pengeluaran || "", e.saldo_akhir, e.source || ""]);
    const name = `BAC_Cash_${todayStr()}`;
    try {
      if (fmt === "csv") downloadCsv(headers, rows, name + ".csv");
      else downloadXlsx(headers, rows, "Buku Kas BAC", name + ".xlsx");

const statusColor = (s) => {
  const t = String(s || "").toLowerCase();
  if (t.includes("cair")) return "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
  if (t.includes("batal") || t.includes("kembali")) return "bg-rose-500/10 text-rose-400 border-rose-500/30";
  if (t.includes("selesai")) return "bg-sky-500/10 text-sky-400 border-sky-500/30";
  return "bg-amber-500/10 text-amber-400 border-amber-500/30";
};

const ImportTab = ({ d }) => {

  useEffect(() => { if (d.settings && d.settings.shopee_biaya_pct !== undefined) setBiayaPct(num(d.settings.shopee_biaya_pct)); }, [d.settings?.shopee_biaya_pct]);

  const preview = useMemo(() => {
    if (!rows) return null;
    try { return buildPreview(rows, d.skus, biayaPct); } catch (e) { return null; }

  const onFile = async (f) => {
    if (!f) return;

const MonitoringTab = ({ d }) => {
  const [edit, setEdit] = useState(null);

  const [q, setQ] = useState("");

  const skuCode = useMemo(() => Object.fromEntries(d.skus.map((s) => [s.id, s.code])), [d.skus]);
  const orders = useMemo(() => d.orders.map((o) => ({ ...o, sku_code: o.sku_id ? skuCode[o.sku_id] || null : null })), [d.orders, skuCode]);
  const totals = {
    nilai: sum(orders, (o) => o.nilai), biaya: sum(orders, (o) => o.biaya), pendapatan_akhir: sum(orders, (o) => o.pendapatan_akhir),
    count: orders.length, belum_cair: orders.filter((o) => !o.cair).length
  };
  const filtered = orders.filter((o) => {
    if (statusFilter !== "all") {
      const s = String(o.status || "").toLowerCase();
      if (statusFilter === "cair" && !o.cair) return false;
      if (statusFilter === "belum" && o.cair) return false;
      if (["selesai", "proses", "dibatalkan"].includes(statusFilter) && !s.includes(statusFilter)) return false;
    }
    if (q && !`${o.order_no} ${o.sku_code || ""} ${o.product_name} ${o.shopee_title || ""}`.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  const reconcile = async (o) => {
    try {
      await updateShopeeOrder(o, { cair: !o.cair, status: !o.cair ? "Cair" : "Selesai" }, d.actor);
      toast(!o.cair ? "Ditandai Cair (masuk rekening)" : "Status cair dibatalkan");
    } catch (e) { toast("Gagal memperbarui", "err"); }
  };
  const remove = async (o) => {
    if (!confirm(`Hapus pesanan ${o.order_no}? Catatan kas otomatisnya ikut terhapus.`)) return;
    try { await deleteShopeeOrder(o.id); } catch (e) { toast("Gagal menghapus", "err"); }
  };
  const saveEdit = async () => {
    const base = d.orders.find((x) => x.id === edit.id) || edit;
    try {
      await updateShopeeOrder(base, { status: edit.status, biaya: Number(edit.biaya) || 0, nilai: Number(edit.nilai) || 0, tanggal_cair: edit.tanggal_cair || "" }, d.actor);
      setEdit(null); toast("Pesanan diperbarui");

              <td class="px-3 py-2.5 font-mono text-xs text-emerald-300 whitespace-nowrap">${o.tanggal_cair ? fmtDate(o.tanggal_cair) : "-"}</td>
              <td class="px-3 py-2.5 text-right font-mono whitespace-nowrap">${fmtNum(o.nilai)}</td>
              <td class="px-3 py-2.5 text-center"><span class=${cx("text-[10px] px-2 py-0.5 rounded border whitespace-nowrap", statusColor(o.status))}>${o.status}</span></td>
              <td class="px-3 py-2.5 text-right font-mono text-rose-400 whitespace-nowrap">${fmtNum(o.biaya)}</td>
              <td class="px-3 py-2.5 text-right font-mono text-emerald-400 font-bold whitespace-nowrap">${fmtNum(o.pendapatan_akhir)}</td>
              <td class="px-3 py-2.5">
                <div class="flex items-center justify-center gap-1">
                  <button onClick=${() => reconcile(o)} title=${o.cair ? "Batalkan cair" : "Tandai cair"} aria-label=${o.cair ? "Batalkan cair" : "Tandai cair"} class=${cx("w-8 h-8 rounded flex items-center justify-center", o.cair ? "bg-emerald-500/20 text-emerald-400" : "bg-amber-500/10 text-amber-400 hover:bg-amber-500/20")}><${Icon} name=${o.cair ? "cash" : "clock"} cls="w-4 h-4" /></button>
                  <button onClick=${() => setEdit({ ...o })} aria-label="Edit pesanan" class="w-8 h-8 rounded flex items-center justify-center text-muted-foreground hover:bg-white/10"><${Icon} name="edit" cls="w-3.5 h-3.5" /></button>
                  <button onClick=${() => remove(o)} aria-label="Hapus pesanan" class="w-8 h-8 rounded flex items-center justify-center text-muted-foreground hover:bg-rose-500/10 hover:text-rose-400"><${Icon} name="trash" cls="w-3.5 h-3.5" /></button>
                </div>
              </td>
            </tr>`)}
          </tbody>
          ${orders.length > 0 && html`<tfoot class="bg-[#0F1420] font-mono font-bold border-t-2 border-[#262F40]"><tr>
            <td class="px-3 py-2.5 text-xs" colspan="3">TOTAL (${totals.count} pesanan)</td>
            <td class="px-3 py-2.5 text-right whitespace-nowrap">${fmtNum(totals.nilai)}</td><td></td>
            <td class="px-3 py-2.5 text-right text-rose-400 whitespace-nowrap">${fmtNum(totals.biaya)}</td>
            <td class="px-3 py-2.5 text-right text-emerald-400 whitespace-nowrap">${fmtNum(totals.pendapatan_akhir)}</td><td></td>
          </tr></tfoot>`}
        </table>
      </div>
    </div>

    <${Modal} open=${!!edit} onClose=${() => setEdit(null)} title=${`Edit Pesanan ${edit ? edit.order_no : ""}`}>
      ${edit && html`<div class="space-y-3">
        <div><${Lbl}>Status<//>
          <${Sel} value=${edit.status} onChange=${(e) => setEdit({ ...edit, status: e.target.value })} cls="w-full !bg-[#0B0F17]">
            ${["Selesai", "Sedang Dikirim", "Proses", "Cair", "Dibatalkan", "Dikembalikan"].map((s) => html`<option key=${s} value=${s}>${s}</option>`)}
          <//>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><${Lbl}>Nilai<//><${Inp} type="number" inputmode="numeric" value=${edit.nilai} onInput=${(e) => setEdit({ ...edit, nilai: e.target.value })} cls="font-mono" /></div>
          <div><${Lbl}>Biaya<//><${Inp} type="number" inputmode="numeric" value=${edit.biaya} onInput=${(e) => setEdit({ ...edit, biaya: e.target.value })} cls="font-mono" /></div>
        </div>
        <div><${Lbl}>Tanggal Cair<//><${Inp} type="date" value=${edit.tanggal_cair || ""} onInput=${(e) => setEdit({ ...edit, tanggal_cair: e.target.value })} /></div>
        <p class="text-xs text-muted-foreground">Pendapatan akhir = ${fmtRp((Number(edit.nilai) || 0) - (Number(edit.biaya) || 0))}</p>
        <${Btn} onClick=${saveEdit} cls="w-full">Simpan<//>
      </div>`}
    <//>
  </div>`;
};

/* ======================= BACKUP & AKUN ======================= */
const SettingsPage = ({ d, user }) => {
  const [busy, setBusy] = useState("");
  const pick = useRef(null);
  const doBackup = async () => {
    setBusy("backup");
    try { const n = await exportBackup(); toast(`Backup selesai (${n} data)`); }
    catch (e) { console.error(e); toast("Gagal membuat backup", "err"); }
    finally { setBusy(""); }
  };
  const doRestore = async (file) => {
    if (!file) return;
    if (!confirm("Pulihkan data dari file ini? Data dengan ID yang sama akan ditimpa.")) return;
    setBusy("restore");
    try {
      const n = await restoreBackup(JSON.parse(await file.text()));
      toast(`Pemulihan selesai (${n} data)`);
    } catch (e) { console.error(e); toast(e.message || "Gagal memulihkan", "err"); }
    finally { setBusy(""); }
  };
  return html`<div class="max-w-xl space-y-4">
    <div class="bg-[#161B26] border border-[#262F40] rounded-lg p-5">
      <p class="text-xs text-muted-foreground mb-1">Masuk sebagai</p>
      <p class="font-medium">${user.displayName || "BAC"}</p>
      <p class="text-sm text-muted-foreground mb-4 break-all">${user.email}</p>
      <${Btn} variant="outline" onClick=${() => signOut(auth)}><${Icon} name="logout" /> Keluar<//>
    </div>

    <div class="bg-[#161B26] border border-[#262F40] rounded-lg p-5">
      <h3 class="font-semibold mb-1">Backup data</h3>
      <p class="text-sm text-muted-foreground mb-4">Unduh semua data (SKU, kas, pesanan Shopee, riwayat stok, pengaturan) menjadi satu file. Simpan di Google Drive atau kirim ke diri sendiri. Disarankan rutin, misalnya seminggu sekali.</p>
      <${Btn} onClick=${doBackup} disabled=${busy !== ""}>${busy === "backup" ? html`<${Spinner} />` : html`<${Icon} name="download" />`} Unduh backup<//>
    </div>

    <div class="bg-[#161B26] border border-[#262F40] rounded-lg p-5">
      <h3 class="font-semibold mb-1">Pulihkan dari backup</h3>
      <p class="text-sm text-muted-foreground mb-4">Pilih file backup (.json) yang pernah diunduh dari aplikasi ini.</p>
      <input ref=${pick} type="file" accept=".json,application/json" class="hidden" onChange=${(e) => { doRestore(e.target.files[0]); e.target.value = ""; }} />
      <${Btn} variant="outline" onClick=${() => pick.current && pick.current.click()} disabled=${busy !== ""}>${busy === "restore" ? html`<${Spinner} />` : html`<${Icon} name="upload" />`} Pilih file backup<//>
    </div>
  </div>`;
};

/* ======================= LOGIN & APLIKASI UTAMA ======================= */
const explainAuthError = (e) => {
  switch (e && e.code) {
    case "auth/unauthorized-domain":
      return `Alamat ${location.hostname} belum didaftarkan. Buka Firebase > Authentication > Settings > Authorized domains, lalu tambahkan ${location.hostname}.`;
    case "auth/popup-closed-by-user":
    case "auth/cancelled-popup-request":
      return "";
    case "auth/network-request-failed":
      return "Koneksi internet bermasalah. Coba lagi.";
    case "auth/operation-not-allowed":
      return "Login Google belum diaktifkan di Firebase Authentication.";
    default:
      return "Gagal masuk: " + ((e && (e.code || e.message)) || "kesalahan tidak dikenal");
  }
};

const Login = ({ denied }) => {
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const signIn = async () => {
    setBusy(true); setErr("");
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
        try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
      }
      setErr(explainAuthError(e)); setBusy(false);
    }
  };
  return html`<div class="min-h-screen flex items-center justify-center bg-[#0B0F17] px-4">
    <div class="w-full max-w-md fade-up">
      <div class="bg-[#161B26] border border-[#262F40] rounded-xl p-8 shadow-2xl">
        <div class="flex items-center gap-3 mb-8">
          <div class="w-12 h-12 rounded-lg bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400"><${Icon} name="box" cls="w-6 h-6" /></div>
          <div>
            <h1 class="text-xl font-bold tracking-tight">Besi Astana Cakra</h1>
            <p class="text-xs text-muted-foreground font-mono">BAC ERP & Cash System</p>
          </div>
        </div>
        <h2 class="text-2xl font-bold mb-1">Selamat datang</h2>
        <p class="text-sm text-muted-foreground mb-8">Masuk untuk mengelola inventaris, kas harian, dan impor laporan Shopee.</p>
        ${denied && html`<div class="mb-4 rounded-md border border-rose-500/40 bg-rose-500/10 p-3 text-sm text-rose-200">Akun ${denied} tidak diizinkan memakai aplikasi ini. Keluar lalu masuk dengan akun yang terdaftar.</div>`}
        ${denied
          ? html`<${Btn} onClick=${() => signOut(auth)} cls="w-full !h-12">Keluar<//>`
          : html`<button onClick=${signIn} disabled=${busy} class="w-full h-12 rounded-md bg-white text-slate-900 hover:bg-slate-100 font-semibold text-sm flex items-center justify-center gap-3 disabled:opacity-60">
              ${busy ? html`<${Spinner} cls="w-5 h-5" />` : html`<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>`}
              Masuk dengan Google
            </button>`}
        ${err && html`<p class="mt-4 text-sm text-rose-300">${err}</p>`}
      </div>
    </div>
  </div>`;
};

const FullSpinner = ({ text }) => html`<div class="min-h-screen flex flex-col items-center justify-center gap-3 bg-[#0B0F17] text-sky-400"><${Spinner} cls="w-8 h-8" />${text && html`<p class="text-sm text-muted-foreground">${text}</p>`}</div>`;

const LoadError = ({ code }) => html`<div class="min-h-screen flex items-center justify-center bg-[#0B0F17] px-4">
  <div class="w-full max-w-md bg-[#161B26] border border-rose-500/40 rounded-xl p-6">
    <h2 class="text-lg font-bold mb-2">Data belum bisa dibuka</h2>
    <p class="text-sm text-slate-300 mb-3">${code === "permission-denied"
      ? "Aturan keamanan Firestore belum dipasang, atau email Anda belum ada di daftar aturan. Buka Firebase > Firestore Database > Rules, tempel isi file firestore.rules, lalu tekan Publish."
      : "Terjadi gangguan saat memuat data. Periksa internet lalu muat ulang."}</p>
    <p class="text-xs text-muted-foreground font-mono mb-4 break-all">Kode: ${code}</p>
    <div class="flex gap-2">
      <${Btn} onClick=${() => location.reload()}>Muat ulang<//>
      <${Btn} variant="outline" onClick=${() => signOut(auth)}>Keluar<//>
    </div>
  </div>
</div>`;

const readPage = () => {
  const p = (location.hash || "").replace(/^#\/?/, "");
  return NAV.some((n) => n.to === p) ? p : "dashboard";
};

const App = () => {
  const [user, setUser] = useState(undefined);
  const [page, setPage] = useState(readPage());
  const [data, setData] = useState({ skus: [], cash: [], orders: [], settings: {}, ready: false });
  const [loadErr, setLoadErr] = useState("");

  useEffect(() => onAuthStateChanged(auth, (u) => setUser(u)), []);
  useEffect(() => {
    const h = () => { setPage(readPage()); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", h);
    return () => window.removeEventListener("hashchange", h);
  }, []);

  const email = user ? String(user.email || "").toLowerCase() : "";
  const allowed = !!user && ALLOWED_EMAILS.includes(email);

  useEffect(() => {
    if (!allowed) return;
    const loaded = {};
    const mark = (k) => { loaded[k] = true; if (Object.keys(loaded).length === 4) setData((x) => ({ ...x, ready: true })); };
    const onErr = (e) => { console.error(e); setLoadErr(e.code || e.message || "unknown"); };
    const un = [
      onSnapshot(collection(db, "skus"), (s) => {
        const skus = s.docs.map((x) => x.data()).sort((a, b) => String(a.code).localeCompare(String(b.code)));
        setData((x) => ({ ...x, skus })); mark("skus");
      }, onErr),
      onSnapshot(collection(db, "cash"), (s) => { setData((x) => ({ ...x, cash: s.docs.map((r) => r.data()) })); mark("cash"); }, onErr),
      onSnapshot(collection(db, "shopee_orders"), (s) => {
        const orders = s.docs.map((r) => r.data()).sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
        setData((x) => ({ ...x, orders })); mark("orders");
      }, onErr),
      onSnapshot(doc(db, "settings", "global"), (s) => { setData((x) => ({ ...x, settings: s.exists() ? s.data() : {} })); mark("settings"); }, onErr)
    ];
    return () => un.forEach((u) => u());
  }, [allowed]);

  if (user === undefined) return html`<${FullSpinner} />`;
  if (!user) return html`<${Login} />`;
  if (!allowed) return html`<${Login} denied=${user.email} />`;
  if (loadErr) return html`<${LoadError} code=${loadErr} />`;
  if (!data.ready) return html`<${FullSpinner} text="Memuat data..." />`;

  const d = { ...data, actor: user.displayName || user.email };
  const body = page === "dashboard" ? html`<${Dashboard} d=${d} />`
    : page === "inventory" ? html`<${Inventory} d=${d} />`
    : page === "shopee" ? html`<${Shopee} d=${d} />`
    : page === "cashbook" ? html`<${CashBook} d=${d} />`
    : html`<${SettingsPage} d=${d} user=${user} />`;
  return html`<${Layout} page=${page} user=${user} skus=${data.skus}>${body}<//>`;
};

if (window.Chart) {
  window.Chart.defaults.color = "#9CA3AF";
  window.Chart.defaults.borderColor = "#262F40";
  window.Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
}
render(html`<${App} /><${Toaster} />`, document.getElementById("app"));
const boot = document.getElementById("boot");
if (boot) boot.remove();
</script>
</body>
</html>
